      <stop offset="0%" stop-color="#FB6F92"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square Base -->
  <rect x="24" y="24" width="208" height="208" rx="52" fill="#FFF9FB" stroke="#FB6F92" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Left Photo Frame (Ink Violet Silhouette) -->
  <rect x="52" y="60" width="72" height="116" rx="10" fill="#2B2D42"/>
