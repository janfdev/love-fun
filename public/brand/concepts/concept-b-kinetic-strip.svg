  <rect x="106" y="90" width="52" height="58" rx="6" fill="#FFF9FB"/>
  <!-- Heart Lens Inside Right Frame -->
  <path d="M132 126C122 115 112 106 112 98C112 91 117 87 123 87C127 87 130 89 132 92C134 89 137 87 141 87C147 87 152 91 152 98C152 106 142 115 132 126Z" fill="#FB6F92"/>
